<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Path B Trash Separator</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --ink: #18181b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --recyclable: #10b981;
      --trash: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 760px;
      display: grid;
      gap: 16px;
    }

    h1 { margin: 0; font-size: 32px; }
    .lead { margin: 4px 0 0; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 4%);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    button, .file-label {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    button.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .file-label {
      display: block;
      border: 2px dashed var(--border);
      padding: 40px 20px;
      color: var(--muted);
    }

    .file-label:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    input[type="file"] { display: none; }

    .preview {
      display: none;
      margin-top: 16px;
      text-align: center;
    }

    img, video, canvas {
      max-width: 100%;
      max-height: 340px;
      border-radius: 12px;
      background: #111;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error { color: #991b1b; }

    .results {
      display: none;
      margin-top: 16px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr 64px;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .bar-track {
      height: 12px;
      background: #f0f1f4;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .verdict {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }

    .verdict.recyclable { background: #d1fae5; color: #065f46; }
    .verdict.trash { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Path B Trash Separator</h1>
      <p class="lead">Uses your custom TensorFlow/Keras model from <code>Models/trash_separator_final.keras</code>.</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button id="upload-tab" class="active" type="button">Upload Image</button>
        <button id="webcam-tab" type="button">Webcam</button>
      </div>

      <div id="upload-pane">
        <label class="file-label">
          <input id="file-input" type="file" accept="image/*" />
          <strong>Choose an image</strong><br />
          <span>JPEG, PNG, or webcam photo</span>
        </label>
        <div id="upload-preview" class="preview">
          <img id="preview-img" alt="Selected image preview" />
        </div>
      </div>

      <div id="webcam-pane" style="display:none">
        <div class="preview" style="display:block">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas" style="display:none"></canvas>
        </div>
        <div class="actions">
          <button id="start-webcam" class="primary" type="button">Start Webcam</button>
          <button id="capture" type="button" disabled>Capture and Predict</button>
          <button id="stop-webcam" type="button" disabled>Stop Webcam</button>
        </div>
      </div>

      <div id="status" class="status">Ready. Upload an image or start the webcam.</div>

      <div id="results" class="results">
        <div id="bars"></div>
        <div id="verdict" class="verdict"></div>
      </div>
    </section>
  </main>

  <script>
    const uploadTab = document.getElementById("upload-tab");
    const webcamTab = document.getElementById("webcam-tab");
    const uploadPane = document.getElementById("upload-pane");
    const webcamPane = document.getElementById("webcam-pane");
    const fileInput = document.getElementById("file-input");
    const previewImg = document.getElementById("preview-img");
    const uploadPreview = document.getElementById("upload-preview");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");
    const bars = document.getElementById("bars");
    const verdict = document.getElementById("verdict");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startWebcam = document.getElementById("start-webcam");
    const capture = document.getElementById("capture");
    const stopWebcam = document.getElementById("stop-webcam");

    let stream = null;

    uploadTab.addEventListener("click", () => setTab("upload"));
    webcamTab.addEventListener("click", () => setTab("webcam"));

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      previewImg.src = URL.createObjectURL(file);
      uploadPreview.style.display = "block";
      await predictFile(file);
    });

    startWebcam.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        startWebcam.disabled = true;
        capture.disabled = false;
        stopWebcam.disabled = false;
        setStatus("Webcam ready. Click Capture and Predict.");
      } catch (error) {
        setStatus("Could not access webcam: " + error.message, true);
      }
    });

    capture.addEventListener("click", async () => {
      if (!stream) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      canvas.toBlob(async (blob) => {
        if (!blob) {
          setStatus("Could not capture webcam image.", true);
          return;
        }
        await predictFile(new File([blob], "webcam.jpg", { type: "image/jpeg" }));
      }, "image/jpeg", 0.95);
    });

    stopWebcam.addEventListener("click", stopCamera);

    function setTab(tab) {
      const upload = tab === "upload";
      uploadTab.classList.toggle("active", upload);
      webcamTab.classList.toggle("active", !upload);
      uploadPane.style.display = upload ? "block" : "none";
      webcamPane.style.display = upload ? "none" : "block";
      if (upload) stopCamera();
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      startWebcam.disabled = false;
      capture.disabled = true;
      stopWebcam.disabled = true;
    }

    async function predictFile(file) {
      const formData = new FormData();
      formData.append("image", file);

      setStatus("Predicting...");

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Prediction failed.");
        }

        renderPrediction(data);
        setStatus("Prediction complete.");
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function renderPrediction(data) {
      bars.innerHTML = "";

      Object.entries(data.probabilities).forEach(([className, probability]) => {
        const percent = probability * 100;
        const color = className.toLowerCase().includes("recycl") ? "var(--recyclable)" : "var(--trash)";
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <strong>${className}</strong>
          <div class="bar-track"><div class="bar-fill" style="width:${percent.toFixed(1)}%;background:${color}"></div></div>
          <span>${percent.toFixed(1)}%</span>
        `;
        bars.appendChild(row);
      });

      const isRecyclable = data.topClass.toLowerCase().includes("recycl");
      verdict.className = "verdict " + (isRecyclable ? "recyclable" : "trash");
      verdict.textContent = data.message;
      results.style.display = "block";
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }
  </script>
</body>
</html>
